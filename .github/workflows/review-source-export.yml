name: Review source snapshot
on:
  push:
    branches: [stefan-invoice-financing-refinements]
    paths: ['.github/workflows/review-source-export.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar.gz HEAD > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: /tmp/review-source.tar.gz
          retention-days: 1
