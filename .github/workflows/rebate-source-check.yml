name: Validate rebate review candidate
on:
  push:
    branches: [stefan-invoice-financing-refinements]
    paths: ['.github/workflows/rebate-source-check.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply audited source edits and browser checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,urllib.request,pathlib,subprocess
          root='https://api.github.com/repos/avenews/platform/git/blobs/'
          def blob(sha):
            req=urllib.request.Request(root+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            return base64.b64decode(json.load(urllib.request.urlopen(req))['content'])
          pathlib.Path('/tmp/rebate-edits.py').write_bytes(blob('46a6958e7897a3ead6c20553eafee430ffaa938d'))
          subprocess.run(['python','/tmp/rebate-edits.py'],check=True)
          pathlib.Path('tests/invoice-refinements/rebates.spec.ts').write_bytes(blob('04c6042784c143b371b7b6b91cf96722dc775199'))
          PY
      - name: Validate production build and rebate calculations
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0 esbuild@0.25.9
          npm run check
          node scripts/test-invoice-correction.mjs
      - name: Store candidate tree without updating branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,subprocess,pathlib,urllib.request
          api='https://api.github.com/repos/avenews/platform/git/'
          def post(endpoint,data):
            req=urllib.request.Request(api+endpoint,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            return json.load(urllib.request.urlopen(req))
          subprocess.run(['git','add','src','tests','scripts','docs'],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert all(p.startswith(('src/','tests/','scripts/','docs/')) for p in paths)
          entries=[];hashes={}
          for p in paths:
            data=pathlib.Path(p).read_bytes();hashes[p]=hashlib.sha256(data).hexdigest()
            sha=post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
            entries.append({'path':p,'mode':'100644','type':'blob','sha':sha})
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=post('trees',{'base_tree':base,'tree':entries})['sha']
          pathlib.Path('/tmp/rebate-candidate.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'tree':tree,'hashes':hashes,'ref_updated':False},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rebate-candidate-${{ github.sha }}
          path: /tmp/rebate-candidate.json
          retention-days: 1
