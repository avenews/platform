name: Delete legacy LMS branches

on:
  push:
    branches: ["agent/design-foundation"]
    paths:
      - ".github/DELETE_LEGACY_LMS_BRANCHES"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out active design branch
        uses: actions/checkout@v4
        with:
          ref: agent/design-foundation
          persist-credentials: true

      - name: Delete legacy LMS branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "archive/lms-prototype-v0.4"
            "build/step-1"
            "dev"
            "spec/v0.4"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Branch still exists: ${branch}" >&2
              exit 1
            fi
          done
