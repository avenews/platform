name: Validate clean preview 77 rebuild
on:
  push:
    branches: [stefan-invoice-partner-review]
    paths: ['.github/workflows/rebuild-77-candidate.yml']
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct exact original source and apply reviewed additive edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/correction-candidate /tmp/correction-evidence
          git archive 4d10fb879c1e3e5b6baf0e7d45778949cf30eb8c | tar -x -C /tmp/correction-candidate
          python3 - <<'PY'
          import os,json,base64,gzip,hashlib,urllib.request
          from pathlib import Path
          root=Path('/tmp/correction-candidate')
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          blobs=['812682f2aaa1ee13dd1a693a5d195bd2e76ab7cf','4ebb685f75674799033efd86572cd55ddf3bf900','014ac0cc7ceb7080dbe02c44ec2f41277eef967e','d91ea41a0f21dd9c03bdad12551bd75cf7e6c7d1','7868dd4f995b6612a90ae30ed4c98f4521139edc']
          parts=[]
          for sha in blobs:
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers=headers)
              with urllib.request.urlopen(request) as response: blob=json.load(response)
              parts.append(base64.b64decode(blob['content']).decode())
          raw=gzip.decompress(base64.b64decode(''.join(parts)))
          assert hashlib.sha256(raw).hexdigest()=='d750f2bb7e5dd9f392f75e7dd4540f4dc9f4d86cfe0b06757787909ed86861c0','Payload checksum mismatch'
          edits=json.loads(raw)
          for name,change in edits.items():
              path=root/name
              assert path.resolve().is_relative_to(root) and not name.startswith('.git/'),'Invalid source path'
              if 'new' in change: content=change['new']
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==change['sha256'],name+' baseline differs'
                  lines=old.decode().splitlines(keepends=True)
                  for start,end,replacement in reversed(change['edits']): lines[start:end]=[replacement]
                  content=''.join(lines)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          p=root/'src/app/features/customer-invoices/customer-invoices.component.ts'
          s=p.read_text()
          replacements=[
            ("@Input() role:InvoicePortalRole='supplier'", "@Input({transform:(value:InvoicePortalRole|undefined)=>value==='partner'?'partner':'supplier'}) role:InvoicePortalRole='supplier'"),
            ('  readonly sortOptions: readonly CustomerSortOption[] = [','  get sortOptions(): readonly CustomerSortOption[] { return ['),
            ("{ value: 'buyer-asc', label: 'Buyer / Supplier: A-Z' }", "{ value: 'buyer-asc', label: this.role==='partner'?'Supplier: A-Z':'Buyer: A-Z' }"),
            ('  ]\n\n  get filterValues','  ] }\n\n  get filterValues'),
            ('.invoice-workspace--embedded{width:100%;margin:0}', '.invoice-workspace--embedded{width:100%;margin:0}.invoice-workspace--embedded .baseline-pagination__controls{flex-wrap:wrap;justify-content:center}'),
          ]
          for old,new in replacements:
              assert old in s,old
              s=s.replace(old,new,1)
          p.write_text(s)
          p=root/'src/app/features/contextual-home/contextual-home.component.css'
          p.write_text(p.read_text()+'\n/* Preserve the conditional invoice-upload action on mobile as well. */\n@media(max-width:767px){[data-product-context="invoice-financing"] .contextual-home__primary--hero[data-action="invoice-upload"]{display:inline-flex}}\n'+'\n/* The added rebate action must not shift sibling metric labels or values. */\n.contextual-metrics[aria-label="Partner summary"]>.contextual-metric{align-content:start}\n')
          Path('/tmp/correction-evidence/changed-paths.json').write_text(json.dumps(list(edits),indent=2))
          print('Rebuilt',len(edits),'changed files from exact preview-77 tree. No rejected replacement UI carried over.')
          PY
      - name: Install dependencies
        working-directory: /tmp/correction-candidate
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0 esbuild@0.25.9
      - name: Original baseline, typecheck and production build
        working-directory: /tmp/correction-candidate
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/correction-evidence/build.log
      - name: Domain and record preservation checks
        working-directory: /tmp/correction-candidate
        run: |
          set -o pipefail
          node scripts/test-invoice-correction.mjs 2>&1 | tee /tmp/correction-evidence/domain.log
      - name: Install test browser
        working-directory: /tmp/correction-candidate
        run: npx playwright install --with-deps chromium
      - name: Responsive flows and direct preview-77 style comparison
        working-directory: /tmp/correction-candidate
        env:
          REFERENCE_BASE_URL: https://deploy-preview-77--avenews-platform.netlify.app
        run: |
          set -o pipefail
          npx playwright test --config invoice-correction.playwright.config.mjs --max-failures=6 2>&1 | tee /tmp/correction-evidence/browser.log
      - name: Export validated application tree without changing workflows or branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          from pathlib import Path
          root=Path('/tmp/correction-candidate')
          prefix='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def post(path,data):
              request=urllib.request.Request(prefix+path,headers=headers,data=json.dumps(data).encode(),method='POST')
              try:
                  with urllib.request.urlopen(request) as response:return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.read().decode())
                  raise
          paths=json.loads(Path('/tmp/correction-evidence/changed-paths.json').read_text())
          # Workflow changes use the user's authorized connector, not the Actions token.
          entries=[{'path':name,'mode':'100644','type':'blob','content':(root/name).read_text()} for name in paths if not name.startswith('.github/')]
          tree=post('/git/trees',{'base_tree':'60838d704eb3e3e04a04bc4c363256a62cf06665','tree':entries})
          result={'tree':tree['sha'],'parent':os.environ['GITHUB_SHA'],'base':'4d10fb879c1e3e5b6baf0e7d45778949cf30eb8c','ref_updated':False,'workflow_file_required':'.github/workflows/invoice-review.yml'}
          Path('/tmp/correction-evidence/candidate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview77-rebuild-candidate-${{ github.sha }}
          path: |
            /tmp/correction-evidence
            /tmp/correction-candidate/correction-evidence
            /tmp/correction-candidate/correction-results
          retention-days: 2
