name: Preview 77 correction audit source
on:
  push:
    branches: [stefan-invoice-partner-review]
    paths: ['.github/workflows/rebuild-audit-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact original and review sources
        run: |
          mkdir -p /tmp/correction-source/base /tmp/correction-source/rejected /tmp/correction-export
          git archive 4d10fb879c1e3e5b6baf0e7d45778949cf30eb8c | tar -x -C /tmp/correction-source/base
          git archive 982eae09c83da9a5074f63319ea80fb75db8e9b6 | tar -x -C /tmp/correction-source/rejected
          cd /tmp/correction-source/base
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm install --no-save --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0 esbuild@0.25.9
          tar -czf /tmp/correction-export/preview77-source-and-dependencies.tar.gz -C /tmp/correction-source .
      - uses: actions/upload-artifact@v4
        with:
          name: preview77-correction-source
          path: /tmp/correction-export/preview77-source-and-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
