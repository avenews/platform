name: Import customer portal login assets

on:
  push:
    branches:
      - agent/design-foundation
    paths:
      - .github/workflows/import-login-assets.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out design branch
        uses: actions/checkout@v4
        with:
          ref: agent/design-foundation
          persist-credentials: true

      - name: Download exact reference assets
        env:
          ASSET_ARCHIVE_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6d9c-8211-a90b-2ca971ac3b7d/raw?se=2026-08-12T06%3A34%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=cb98be3a-9d8a-5bd0-94a3-efe48dd92203&skoid=54865dd2-31dc-44cc-a877-635aa4250446&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-12T05%3A55%3A29Z&ske=2026-08-13T05%3A55%3A29Z&sks=b&skv=2026-02-06&sig=HvoiWyOOoCwV%2BRlyWMLgVz4dX0GTqA3YU4xGFtP95sU%3D'
        run: |
          curl --fail --location "$ASSET_ARCHIVE_URL" --output /tmp/login-assets.zip
          rm -rf /tmp/login-assets
          mkdir -p /tmp/login-assets
          unzip /tmp/login-assets.zip -d /tmp/login-assets
          test -f /tmp/login-assets/brand/avenews-logo-new.svg
          test -f /tmp/login-assets/brand/login-bg.png

      - name: Copy assets into the Angular public directory
        run: |
          mkdir -p public/brand
          cp /tmp/login-assets/brand/avenews-logo-new.svg public/brand/
          cp /tmp/login-assets/brand/login-bg.png public/brand/

      - name: Commit exact reference assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/avenews-logo-new.svg public/brand/login-bg.png
          git commit -m 'fix(login): restore Avenews logo and background'
          git push origin HEAD:agent/design-foundation
