name: Angular checks

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  packages: read

jobs:
  public-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove private package for dependency snapshot
        run: |
          node - <<'NODE'
          const fs = require('fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          delete pkg.dependencies['@avenews/design-system']
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          rm -f .npmrc

      - name: Install public dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Archive public dependencies
        run: tar -czf /tmp/platform-public-dependencies.tgz node_modules package-lock.json

      - name: Upload public dependency snapshot
        uses: actions/upload-artifact@v4
        with:
          name: platform-public-dependencies
          path: /tmp/platform-public-dependencies.tgz
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Archive source for isolated validation
        run: tar --exclude=.git -czf /tmp/platform-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: platform-source
          path: /tmp/platform-source.tgz
          if-no-files-found: error

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@avenews"

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type-check
        run: npm run typecheck

      - name: Build production application
        run: npm run build
