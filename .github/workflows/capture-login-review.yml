name: Capture updated login for visual review

on:
  push:
    branches:
      - agent/design-foundation
    paths:
      - .github/workflows/capture-login-review.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Render the deployed login page
        run: |
          google-chrome --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1920,1080 \
            --virtual-time-budget=6000 \
            --screenshot=updated-login.png \
            https://avenews-platform.netlify.app/login

      - name: Upload visual review artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-login-review-browser
          path: updated-login.png
          if-no-files-found: error
